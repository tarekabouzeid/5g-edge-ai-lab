---
# Open5GS 5G Standalone Core, one container per network function.
#
# Image: gradiant/open5gs (https://hub.docker.com/r/gradiant/open5gs) bundles
# every Open5GS NF binary; each service below just points the same image at a
# different config file and binary name. This mirrors the officially
# documented Open5GS architecture (NRF + SCP indirect communication) rather
# than the older direct-NRF pattern from pre-2.6 tutorials.
#
# All NFs share one bridge network (core/.env: CORE_SUBNET) with static IPs
# so the config files below can hardcode addresses, matching how Open5GS's
# own sample configs work. See docs/architecture.md for the addressing table
# and docs/what-is-simulated.md for what this container boundary represents.
#
# Bring up: `docker compose --env-file ../.env up -d`  (run from core/)

services:
  mongodb:
    image: mongo:${MONGO_IMAGE_TAG}
    container_name: open5gs-mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      open5gscore:
        ipv4_address: ${MONGO_IP}

  nrf:
    image: gradiant/open5gs:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-nrf
    command: open5gs-nrfd -c /open5gs/config/nrf.yaml
    restart: unless-stopped
    volumes:
      - ./config/nrf.yaml:/open5gs/config/nrf.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${NRF_IP}

  scp:
    image: gradiant/open5gs:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-scp
    command: open5gs-scpd -c /open5gs/config/scp.yaml
    restart: unless-stopped
    depends_on:
      - nrf
    volumes:
      - ./config/scp.yaml:/open5gs/config/scp.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${SCP_IP}

  ausf:
    image: gradiant/open5gs:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-ausf
    command: open5gs-ausfd -c /open5gs/config/ausf.yaml
    restart: unless-stopped
    depends_on:
      - scp
    volumes:
      - ./config/ausf.yaml:/open5gs/config/ausf.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${AUSF_IP}

  udm:
    image: gradiant/open5gs:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-udm
    command: open5gs-udmd -c /open5gs/config/udm.yaml
    restart: unless-stopped
    depends_on:
      - scp
    volumes:
      - ./config/udm.yaml:/open5gs/config/udm.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${UDM_IP}

  udr:
    image: gradiant/open5gs:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-udr
    command: open5gs-udrd -c /open5gs/config/udr.yaml
    restart: unless-stopped
    depends_on:
      - mongodb
      - scp
    environment:
      - DB_URI=mongodb://${MONGO_IP}/open5gs
    volumes:
      - ./config/udr.yaml:/open5gs/config/udr.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${UDR_IP}

  pcf:
    image: gradiant/open5gs:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-pcf
    command: open5gs-pcfd -c /open5gs/config/pcf.yaml
    restart: unless-stopped
    depends_on:
      - mongodb
      - scp
    environment:
      - DB_URI=mongodb://${MONGO_IP}/open5gs
    volumes:
      - ./config/pcf.yaml:/open5gs/config/pcf.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${PCF_IP}

  bsf:
    image: gradiant/open5gs:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-bsf
    command: open5gs-bsfd -c /open5gs/config/bsf.yaml
    restart: unless-stopped
    depends_on:
      - scp
    volumes:
      - ./config/bsf.yaml:/open5gs/config/bsf.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${BSF_IP}

  nssf:
    image: gradiant/open5gs:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-nssf
    command: open5gs-nssfd -c /open5gs/config/nssf.yaml
    restart: unless-stopped
    depends_on:
      - scp
    volumes:
      - ./config/nssf.yaml:/open5gs/config/nssf.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${NSSF_IP}

  amf:
    image: gradiant/open5gs:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-amf
    command: open5gs-amfd -c /open5gs/config/amf.yaml
    restart: unless-stopped
    depends_on:
      - scp
      - ausf
      - udm
      - nssf
    # No host port publish for N2/NGAP (38412/sctp): the simulated gNB in
    # ran/docker-compose.yml joins this same open5gscore bridge network and
    # reaches AMF directly at ${AMF_IP}:38412, container-to-container — see
    # that file's comment ("avoiding SCTP-over-NAT/port-publish
    # complications"). Publishing it to the host was never needed for this
    # project's fully-containerized RAN, and actively breaks on hosts whose
    # kernel lacks the xt_sctp netfilter module Docker's DNAT rule needs for
    # SCTP port publishing (confirmed on a WSL2 host: `docker run -p
    # 38412:38412/sctp ...` fails outright with "iptables ... Extension sctp
    # revision 0 not supported, missing kernel module?", and — worse — via
    # docker-compose the container was still created but then couldn't bind
    # its own static IP at all, crash-looping with "Cannot assign requested
    # address"; see docs/phase-notes/phase-1.md's "Known risks"). If you
    # need AMF's NGAP port reachable from outside Docker (a real gNB, not
    # this project's simulated one), add the port mapping back on a host
    # whose kernel actually supports it.
    volumes:
      - ./config/amf.yaml:/open5gs/config/amf.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${AMF_IP}

  smf:
    image: gradiant/open5gs:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-smf
    command: open5gs-smfd -c /open5gs/config/smf.yaml
    restart: unless-stopped
    depends_on:
      - scp
      - pcf
    volumes:
      - ./config/smf.yaml:/open5gs/config/smf.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${SMF_IP}

  upf:
    image: gradiant/open5gs:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-upf
    # gradiant/open5gs's own default /entrypoint.sh has a tun_create()
    # function that creates the TUN device, assigns it an address, brings
    # it up, enables ip_forward, and (optionally) adds the NAT rule — but it
    # only handles ONE device (env vars IPV4_TUN_ADDR etc., always named
    # "ogstun"). This project needs TWO (ogstun for the internet DNN,
    # ogstun2 for the edge DNN — see core/config/upf.yaml), which that
    # single-device function can't express, so this entrypoint replaces it
    # entirely rather than trying to reuse it.
    #
    # IMPORTANT: open5gs-upfd itself only opens the TUN character devices
    # (tun_open) — confirmed by direct testing that it does NOT assign
    # addresses or bring the links up itself, even running as root with
    # every capability. Without the ip addr/ip link steps below, both
    # devices are created but sit administratively DOWN with no IP, and
    # every DNN silently blackholes (PDU sessions establish fine — SMF/UPF
    # control-plane signaling doesn't touch the TUN device at all — but no
    # user-plane packet ever moves, which is a much more confusing failure
    # to debug than a startup error). See docs/phase-notes/phase-2.md's
    # "Known risks" for how this was actually found.
    #
    # 10.45.0.1/16 and 10.47.0.1/16 below must match core/config/upf.yaml's
    # session gateway values exactly (that file hardcodes them too, same as
    # here, rather than templating from .env — see this repo's "Version
    # pinning convention" / addressing note in CLAUDE.md).
    #
    # The NAT rule (internet DNN only — the edge DNN is deliberately left
    # un-NAT'd, see core/config/upf.yaml and docs/phase-notes/phase-3.md) is
    # best-effort (`|| echo ... warning`), not chained with `&&`, on
    # purpose: NET_ADMIN alone isn't always enough for the nf_tables
    # iptables backend to work inside a container (seen failing with
    # "Permission denied (you must be root)" even with NET_ADMIN+NET_RAW on
    # GitHub's runners) and the daemon must still start either way — Phase 1
    # only needs the NFs up, not working internet NAT. If the rule fails on
    # your host too, Phase 2's internet-DNN ping check will fail even though
    # everything else works; the edge DNN (Phase 3, the one this project
    # actually cares about) doesn't need this rule to succeed at all.
    entrypoint: >
      sh -c "
      grep -q ogstun /proc/net/dev || ip tuntap add name ogstun mode tun;
      ip addr add 10.45.0.1/16 dev ogstun 2>/dev/null || true;
      ip link set ogstun up;
      grep -q ogstun2 /proc/net/dev || ip tuntap add name ogstun2 mode tun;
      ip addr add 10.47.0.1/16 dev ogstun2 2>/dev/null || true;
      ip link set ogstun2 up;
      iptables -t nat -A POSTROUTING -s ${INTERNET_UE_SUBNET} ! -o ogstun -j MASQUERADE ||
             echo 'WARNING: could not add NAT rule for the internet DNN — continuing anyway, see core/docker-compose.yml';
             exec open5gs-upfd -c /open5gs/config/upf.yaml"
    restart: unless-stopped
    depends_on:
      - smf
    # NET_ADMIN+NET_RAW alone was not enough to open the ogstun TUN device
    # in this environment: "ioctl() failed ... Operation not permitted" even
    # with both capabilities granted (CI caught this — see phase-1.md).
    # ran/docker-compose.yml already runs UERANSIM privileged for the same
    # TUN-access reason; matching that here rather than chasing the exact
    # minimal capability set across different container runtimes.
    #
    # `privileged: true` alone is not enough either: the gradiant/open5gs
    # image's default entrypoint drops to a non-root user (uid 999,
    # CapEff=0 — verified with `docker run ... id` / `/proc/self/status`),
    # and Docker's --privileged only grants the full capability set to a
    # *root* process, not to whatever user the image happens to run as.
    # Force root explicitly so the TUNSETIFF ioctl actually gets
    # CAP_NET_ADMIN — see docs/phase-notes/phase-1.md's "Known risks".
    user: root
    privileged: true
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "2152:2152/udp"      # N3, reached by the UERANSIM gNB
    volumes:
      - ./config/upf.yaml:/open5gs/config/upf.yaml:ro
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      open5gscore:
        ipv4_address: ${UPF_IP}

  webui:
    image: gradiant/open5gs-webui:${OPEN5GS_IMAGE_TAG}
    container_name: open5gs-webui
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      - DB_URI=mongodb://${MONGO_IP}/open5gs
      - NODE_ENV=production
    ports:
      - "9999:9999"          # WebUI login: admin / 1423 by default, change it
    networks:
      open5gscore:
        ipv4_address: ${WEBUI_IP}

networks:
  open5gscore:
    name: open5gscore
    driver: bridge
    ipam:
      config:
        - subnet: ${CORE_SUBNET}
          gateway: ${CORE_GATEWAY}

volumes:
  mongodb-data:

# Two DNNs are advertised for the one S-NSSAI (sst:1):
#   internet -> 10.45.0.0/16 -> NAT'd out via the UPF's eth0 (Phase 1/2 sanity: ping 8.8.8.8)
#   edge     -> 10.47.0.0/16 -> NOT NAT'd; routed toward the edge cluster (Phase 3 local breakout)
# See docs/architecture.md for the routing/NAT rationale and
# docs/phase-notes/phase-3.md for how this is verified with tcpdump.
global:
  max:
    ue: 1024

smf:
  sbi:
    server:
      - address: 10.10.0.4
        port: 7777
    client:
      scp:
        - uri: http://10.10.0.200:7777
  pfcp:
    server:
      - address: 10.10.0.4
    client:
      upf:
        - address: 10.10.0.7
  gtpc:
    server:
      - address: 10.10.0.4
  gtpu:
    server:
      - address: 10.10.0.4
  metrics:
    server:
      - address: 10.10.0.4
        port: 9090
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dnn: internet
    - subnet: 10.47.0.0/16
      gateway: 10.47.0.1
      dnn: edge
  dns:
    - 8.8.8.8
    - 8.8.4.4
  mtu: 1400
  info:
    - s_nssai:
        - sst: 1
          dnn:
            - internet
            - edge

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>5G Edge AI Lab: per-UE edge security (3GPP TS 33.558 model)</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e8e4e"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <style>
      .zone { fill: #f6f8fa; stroke: #9aa4b2; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .zt { font-size: 15px; font-weight: 700; fill: #374151; }
      .zs { font-size: 12px; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.5; }
      .k8s { fill: #eef4ff; stroke: #3b6fd8; stroke-width: 1.5; }
      .envoy { fill: #ecfdf3; stroke: #1e8e4e; stroke-width: 2.5; }
      .authz { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .pki { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; }
      .h { font-size: 15px; font-weight: 700; fill: #111827; }
      .t { font-size: 12.5px; fill: #374151; }
      .m { font-size: 12px; fill: #374151; font-family: Consolas, Menlo, monospace; }
      .mtls { stroke: #1e8e4e; stroke-width: 4; fill: none; }
      .tok { stroke: #2563eb; stroke-width: 2.2; fill: none; }
      .plain { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 3 4; }
      .rev { stroke: #dc2626; stroke-width: 2.2; fill: none; stroke-dasharray: 8 5; }
      .prov { stroke: #b45309; stroke-width: 1.8; fill: none; stroke-dasharray: 2 4; }
      .lg { font-size: 12px; fill: #1e8e4e; font-weight: 600; }
      .lb { font-size: 12px; fill: #2563eb; font-weight: 600; }
      .lr { font-size: 12px; fill: #dc2626; font-weight: 600; }
      .lo { font-size: 12px; fill: #b45309; font-weight: 600; }
      .numt { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1400" height="960" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#111827">5G Edge AI Lab — per-UE edge security (3GPP TS 33.558 model)</text>
  <text x="30" y="60" class="zs">Every phone has its own certificate; it gets a short-lived OAuth 2.0 token over mutual TLS; Envoy, mediamtx and edge-ingest each check what applies. See docs/security.md.</text>

  <!-- ============ PHONES ============ -->
  <rect x="20" y="80" width="330" height="560" rx="10" class="zone"/>
  <text x="36" y="104" class="zt">Phones (UERANSIM UE containers)</text>
  <text x="36" y="122" class="zs">credentials provisioned out of band → /etc/edge/</text>

  <g>
    <rect x="40" y="140" width="290" height="225" rx="8" class="box"/>
    <text x="56" y="164" class="h">📱 UE 1 — eec-ue1</text>
    <text x="56" y="182" class="m">GPSI msisdn-999700000001</text>
    <rect x="54" y="194" width="262" height="72" rx="5" fill="#eff6ff" stroke="#2563eb"/>
    <text x="64" y="213" class="t" font-weight="700">EEC (edge-eec.sh)</text>
    <text x="64" y="231" class="t">curl → token (mTLS, own cert)</text>
    <text x="64" y="249" class="t">socat → mTLS tunnel to the edge</text>
    <rect x="54" y="274" width="262" height="46" rx="5" fill="#f3f4f6" stroke="#9aa4b2"/>
    <text x="64" y="293" class="t" font-weight="700">AC: ffmpeg (camera)</text>
    <text x="64" y="310" class="m">RTSP → 127.0.0.1 (stays on phone)</text>
    <text x="56" y="342" class="m">client.crt/.key · ca.crt</text>
    <text x="56" y="358" class="zs">publishes only to ue/eec-ue1</text>
  </g>
  <g>
    <rect x="40" y="385" width="290" height="235" rx="8" class="box"/>
    <text x="56" y="409" class="h">📱 UE 2 — eec-ue2</text>
    <text x="56" y="427" class="m">GPSI msisdn-999700000002</text>
    <rect x="54" y="439" width="262" height="54" rx="5" fill="#eff6ff" stroke="#2563eb"/>
    <text x="64" y="458" class="t" font-weight="700">EEC + AC</text>
    <text x="64" y="476" class="t">same software, its own credentials</text>
    <text x="56" y="514" class="zs">publishes only to ue/eec-ue2</text>
    <rect x="54" y="528" width="262" height="78" rx="5" fill="#fef2f2" stroke="#dc2626"/>
    <text x="64" y="548" class="lr">⑤ revoked (edge-pki.sh revoke)</text>
    <text x="64" y="566" class="t">• cert on CRL → TLS refused</text>
    <text x="64" y="583" class="t">• no new tokens</text>
    <text x="64" y="600" class="t">• live stream kicked</text>
  </g>

  <!-- ============ 5G PATH ============ -->
  <rect x="385" y="80" width="150" height="560" rx="10" class="zone"/>
  <text x="400" y="104" class="zt">5G user plane</text>
  <text x="400" y="122" class="zs">edge DNN, no NAT</text>
  <rect x="400" y="300" width="120" height="110" rx="8" class="box"/>
  <text x="414" y="325" class="h">gNB → UPF</text>
  <text x="414" y="345" class="t">GTP-U tunnel,</text>
  <text x="414" y="362" class="t">ogstun2 out,</text>
  <text x="414" y="379" class="t">src 10.47.x.x</text>
  <text x="414" y="396" class="zs">(TLS bytes only)</text>

  <!-- ============ EDGE NODE ============ -->
  <rect x="570" y="80" width="810" height="560" rx="10" class="zone"/>
  <text x="586" y="104" class="zt">minikube edge node — 192.168.49.2</text>
  <text x="586" y="122" class="zs">only Envoy is exposed; everything behind it is ClusterIP</text>

  <rect x="590" y="140" width="250" height="480" rx="10" class="envoy"/>
  <text x="606" y="166" class="h">Envoy Gateway</text>
  <text x="606" y="184" class="zs">the edge front door (EAS ingress)</text>
  <text x="606" y="210" class="t" font-weight="700">every TLS listener:</text>
  <text x="606" y="228" class="t">TLS 1.2+ (TS 33.210 profile)</text>
  <text x="606" y="246" class="t">client cert required —</text>
  <text x="606" y="264" class="t">operator CA + CRL</text>
  <rect x="604" y="282" width="222" height="64" rx="5" fill="#ffffff" stroke="#1e8e4e"/>
  <text x="614" y="302" class="m" font-weight="700">:30443 HTTPS</text>
  <text x="614" y="320" class="t">/token → edge-authz</text>
  <text x="614" y="337" class="t">/api/* → ingest + JWT scope</text>
  <rect x="604" y="356" width="222" height="64" rx="5" fill="#ffffff" stroke="#1e8e4e"/>
  <text x="614" y="376" class="m" font-weight="700">:30322 RTSPS</text>
  <text x="614" y="394" class="t">TLS ends here → plain RTSP</text>
  <text x="614" y="411" class="t">+ PROXY header (phone's IP)</text>
  <rect x="604" y="430" width="222" height="44" rx="5" fill="#ffffff" stroke="#9aa4b2"/>
  <text x="614" y="450" class="m" font-weight="700">:30080 HTTP</text>
  <text x="614" y="466" class="t">/healthz only (public)</text>
  <text x="606" y="500" class="t">passes the verified cert to</text>
  <text x="606" y="517" class="t">backends as XFCC (client copies</text>
  <text x="606" y="534" class="t">are stripped)</text>

  <rect x="880" y="140" width="250" height="150" rx="8" class="authz"/>
  <text x="896" y="164" class="h">edge-authz</text>
  <text x="896" y="182" class="zs">ECS/EES authorization role</text>
  <text x="896" y="204" class="t">OAuth 2.0 client credentials</text>
  <text x="896" y="222" class="t">client auth = cert (RFC 8705)</text>
  <text x="896" y="240" class="t">policy: scopes per client</text>
  <text x="896" y="258" class="t">→ RS256 JWT, 10 min, bound</text>
  <text x="896" y="276" class="t">to the cert (cnf)</text>

  <rect x="880" y="320" width="250" height="140" rx="8" class="k8s"/>
  <text x="896" y="344" class="h">edge-gateway (mediamtx)</text>
  <text x="896" y="366" class="t">checks the JWT (RTSP password)</text>
  <text x="896" y="384" class="t">+ path permission:</text>
  <text x="896" y="404" class="m">ue/eec-ue1 ← UE 1 only</text>
  <text x="896" y="422" class="m">ue/eec-ue2 ← UE 2 only</text>
  <text x="896" y="446" class="zs">logs publisher as 10.47.x.x</text>

  <rect x="1160" y="320" width="200" height="140" rx="8" class="k8s"/>
  <text x="1176" y="344" class="h">edge-ingest</text>
  <text x="1176" y="366" class="t">reads ue/* with its own</text>
  <text x="1176" y="384" class="t">service token</text>
  <text x="1176" y="406" class="t">API: re-checks JWT,</text>
  <text x="1176" y="424" class="t">scope + cert binding</text>
  <text x="1176" y="446" class="zs">YOLOv8n on CPU</text>

  <rect x="1160" y="500" width="200" height="90" rx="8" fill="#f3ecff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1176" y="524" class="h">vlm (Gemma 4)</text>
  <text x="1176" y="544" class="t">static API key</text>
  <text x="1176" y="562" class="t">(in-cluster only)</text>
  <text x="1176" y="580" class="zs">the GPU</text>

  <rect x="880" y="500" width="250" height="90" rx="8" class="box"/>
  <text x="896" y="524" class="h">lab portal / Prometheus</text>
  <text x="896" y="544" class="t">portal: own cert + token via</text>
  <text x="896" y="562" class="t">Envoy · Prometheus: OAuth 2.0</text>
  <text x="896" y="580" class="t">client secret, in-cluster</text>

  <!-- ============ OPERATOR PROVISIONING ============ -->
  <rect x="20" y="665" width="1360" height="135" rx="10" class="pki"/>
  <text x="36" y="690" class="h" fill="#92400e">Operator provisioning — out of band (in the lab: scripts/edge-pki.sh, .edge-pki/ git-ignored)</text>
  <text x="36" y="714" class="t">• Operator CA · per-UE client certificates (CN = EEC ID, SAN = EEC ID + GPSI) · edge server certificate (edge.lab, node IP, relay IP)</text>
  <text x="36" y="734" class="t">• token-signing key (edge-authz) + public JWKS (Envoy, mediamtx, edge-ingest) · CRL (Envoy) · revocation list (edge-authz)</text>
  <text x="36" y="754" class="t">• each phone gets: its certificate + key, the CA, a profile (client ID, token URL, edge address + TLS name, stream path)</text>
  <text x="36" y="774" class="t">• service secrets (edge-ingest, Prometheus, VLM key): scripts/edge-keys.sh → .env → Secret edge-auth.   Nothing is ever in a manifest or in git.</text>
  <path d="M180,665 L180,624" class="prov" marker-end="url(#o)"/>
  <path d="M700,665 L700,624" class="prov" marker-end="url(#o)"/>
  <path d="M1000,665 L1000,594" class="prov" marker-end="url(#o)"/>
  <text x="188" y="652" class="lo">/etc/edge/</text>
  <text x="708" y="652" class="lo">Secrets / ConfigMaps</text>

  <!-- ============ FLOWS ============ -->
  <!-- 1: token request UE1 -> 5G -> Envoy :30443 -> authz -->
  <path d="M316,222 C360,222 360,320 398,330" class="mtls"/>
  <path d="M520,330 C560,320 570,312 602,312" class="mtls" marker-start="url(#g)" marker-end="url(#g)"/>
  <path d="M826,305 C850,290 850,230 878,225" class="tok" marker-start="url(#b)" marker-end="url(#b)"/>
  <!-- 3: RTSPS tunnel UE1 -> Envoy :30322 -> mediamtx -->
  <path d="M316,252 C365,262 365,370 398,385" class="mtls"/>
  <path d="M520,385 C560,388 570,388 602,388" class="mtls" marker-end="url(#g)"/>
  <path d="M826,390 L878,390" class="plain" marker-end="url(#s)"/>
  <!-- UE2 stream -->
  <path d="M316,466 C365,466 370,410 398,400" class="mtls" stroke-opacity="0.55"/>
  <!-- 4: ingest reads -->
  <path d="M1158,395 L1132,395" class="plain" marker-end="url(#s)"/>
  <path d="M1260,462 L1260,498" class="plain" marker-end="url(#s)"/>
  <!-- 5: revoke -->
  <path d="M316,567 C450,600 600,640 700,624" class="rev" marker-end="url(#r)"/>

  <g>
    <circle cx="360" cy="270" r="12" fill="#1e8e4e"/><text x="356" y="275" class="numt">1</text>
    <circle cx="862" cy="275" r="12" fill="#2563eb"/><text x="858" y="280" class="numt">2</text>
    <circle cx="372" cy="355" r="12" fill="#1e8e4e"/><text x="368" y="360" class="numt">3</text>
    <circle cx="1146" cy="372" r="12" fill="#6b7280"/><text x="1142" y="377" class="numt">4</text>
    <circle cx="520" cy="612" r="12" fill="#dc2626"/><text x="516" y="617" class="numt">5</text>
  </g>
  <text x="532" y="296" class="lg">mTLS</text>
  <text x="842" y="200" class="lb" font-size="11">XFCC</text>

  <!-- ============ LEGEND + STEPS ============ -->
  <g transform="translate(30,820)">
    <line x1="0" y1="8" x2="40" y2="8" class="mtls"/><text x="50" y="13" class="t"><tspan font-weight="700">Mutual TLS</tspan> on every network hop phone ↔ edge (the radio/UPF path only carries encrypted bytes)</text>
    <line x1="0" y1="32" x2="40" y2="32" class="tok"/><text x="50" y="37" class="t"><tspan font-weight="700">OAuth 2.0 token</tspan> request / response and identity forwarding</text>
    <line x1="0" y1="56" x2="40" y2="56" class="plain"/><text x="50" y="61" class="t"><tspan font-weight="700">Plain, in-cluster</tspan> (Envoy → backends, pod → pod) — a known gap, docs/security.md</text>
    <line x1="0" y1="80" x2="40" y2="80" class="rev"/><text x="50" y="85" class="t"><tspan font-weight="700">Revocation</tspan> of one phone; the other keeps streaming</text>
    <text x="760" y="13" class="t">① EEC asks for a token over mTLS (its own certificate), via Envoy</text>
    <text x="760" y="37" class="t">② edge-authz returns a JWT on the same connection: scope video.publish, ue/&lt;EEC ID&gt;</text>
    <text x="760" y="61" class="t">③ ffmpeg streams through the EEC's mTLS tunnel, token as password</text>
    <text x="760" y="85" class="t">④ edge-ingest reads with its service token → YOLO + VLM</text>
    <text x="760" y="109" class="t">⑤ revoke: CRL at Envoy + no tokens + live stream kicked</text>
  </g>
</svg>

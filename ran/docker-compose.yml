---
# UERANSIM gNB + UE, joining the Open5GS core network started by
# ../core/docker-compose.yml (must be up first: it creates the "open5gscore"
# network this file attaches to as `external`).
#
# Bring up: `docker compose --env-file ../.env up -d` (run from ran/)
# gNB and UE run as separate containers (not host processes) so both can
# reach the AMF's SCTP/N2 address and the UPF's N3 address directly on the
# same bridge network, avoiding SCTP-over-NAT/port-publish complications.

services:
  gnb:
    image: gradiant/ueransim:${UERANSIM_IMAGE_TAG}
    container_name: ueransim-gnb
    # gradiant/ueransim's baked-in ENTRYPOINT (/entrypoint.sh) is a wrapper
    # that only understands a literal first arg of "gnb" or "ue" — anything
    # else (including our "nr-gnb") falls through to its unknown-component
    # branch and mis-parses the rest, e.g. treating "-c" as the command to
    # exec (confirmed: `cat /entrypoint.sh` inside the image). Worse, even
    # its "gnb"/"ue" branches don't take an arbitrary -c <file> — they only
    # envsubst their own baked-in /etc/ueransim/{gnb,ue}.yaml templates, no
    # way to point them at this project's own gnb-config.yaml/ue-config.yaml
    # (matched to core/'s PLMN/TAC/keys). Bypass the wrapper entirely and
    # run nr-gnb directly — it's a normal binary on PATH that takes -c fine
    # (`docker run --entrypoint nr-gnb ... --help` confirms usage).
    entrypoint: []
    command: nr-gnb -c /ueransim/config/gnb-config.yaml
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    privileged: true   # UERANSIM needs raw socket + TUN access
    volumes:
      - ./gnb-config.yaml:/ueransim/config/gnb-config.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${GNB_IP}

  ue:
    image: gradiant/ueransim:${UERANSIM_IMAGE_TAG}
    container_name: ueransim-ue
    # See the gnb service's comment above — same wrapper-entrypoint issue,
    # same bypass.
    entrypoint: []
    command: nr-ue -c /ueransim/config/ue-config.yaml
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      - gnb
    cap_add:
      - NET_ADMIN
    privileged: true   # required to create the uesimtunN TUN interface(s)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./ue-config.yaml:/ueransim/config/ue-config.yaml:ro
    networks:
      open5gscore:
        ipv4_address: ${UE_IP}

networks:
  open5gscore:
    name: open5gscore
    external: true

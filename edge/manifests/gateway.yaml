# Phase 5: the "Ingress/Gateway Pod" from PROJECT_PLAN.md's architecture
# diagram — an RTSP server (mediamtx) that scripts/stream-test-video.sh
# pushes a test video into, and that edge/ingest/app.py reads from.
#
# Not exposed on the node any more: phones reach it only through Envoy's
# RTSPS listener (edge/manifests/edge-envoy.yaml), which terminates mutual
# TLS and forwards plain RTSP here with the PROXY protocol.
#
# Access control (docs/security.md): every publish/read/API call needs a JWT
# from edge-authz, passed as the RTSP password (or a Bearer token for the
# API). Permissions come from the token's mediamtx_permissions claim: a
# phone may publish only to ue/<its EEC ID>; edge-ingest may read ue/* and
# use the API. No anonymous access, no shared passwords.
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-gateway-config
data:
  # The control API (cluster-internal) lets edge-ingest find the active
  # publisher and its source address, and edge-authz close the streams of a
  # revoked phone.
  mediamtx.yml: |
    api: yes
    apiAddress: :9997
    authMethod: jwt
    # Public keys only (fetched once at the first authentication — restart
    # the gateway after rotating the signing key).
    authJWTJWKS: http://edge-authz:8080/jwks.json
    authJWTClaimKey: mediamtx_permissions
    authJWTIssuer: https://edge.lab/authz
    authJWTAudience: edge-eas
    # Envoy sends a PROXY protocol header carrying the phone's address.
    # Pod-network sources may send one; without it the TCP peer is used.
    rtspTrustedProxies: ["10.244.0.0/16"]
    # Only RTSP over TCP: it is what passes through Envoy's TLS listener.
    rtspTransports: [tcp]
    paths:
      all_others:
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  labels:
    app: edge-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.21.0
          ports:
            - containerPort: 8554
              name: rtsp
            - containerPort: 9997
              name: api
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: edge-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
spec:
  selector:
    app: edge-gateway
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway-api
spec:
  selector:
    app: edge-gateway
  ports:
    - name: api
      port: 9997
      targetPort: 9997

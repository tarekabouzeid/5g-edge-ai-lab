# Phase 5: the "Ingress/Gateway Pod" from PROJECT_PLAN.md's architecture
# diagram — an RTSP server (mediamtx) that scripts/stream-test-video.sh
# pushes a test video into, and that edge/ingest/app.py reads from.
#
# Exposed as a NodePort so it's reachable from the UPF's un-NAT'd 'edge' DNN
# subnet (10.47.0.0/16) per Phase 3's local breakout — the host's NodePort
# range is reachable from that subnet once edge/setup-minikube-breakout.sh
# has run, without needing a LoadBalancer controller for a single-node lab.
#
# Access control (docs/security.md): no anonymous access. Phones publish with
# the UE stream key (rtsp://ue:<EDGE_UE_STREAM_KEY>@<node>:30554/stream);
# edge-ingest reads and polls the API with its own key. Passwords are
# injected from the edge-auth Secret via mediamtx's MTX_AUTHINTERNALUSERS_<n>_PASS
# environment overrides (applied after this file, per user index), so the
# ConfigMap holds no secrets. A missing Secret keeps the pod from starting.
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-gateway-config
data:
  # Enables mediamtx's control API (cluster-internal only — the Service's
  # NodePort exposes 8554 alone) so edge-ingest's demo page can show the
  # RTSP publisher's source IP, i.e. the UE's un-NAT'd edge-DNN address.
  mediamtx.yml: |
    api: yes
    apiAddress: :9997
    authInternalUsers:
      # 0: phones (the UE) — publish to /stream only.
      - user: ue
        pass:
        ips: []
        permissions:
          - action: publish
            path: stream
      # 1: edge-ingest — read /stream, and the API (publisher IP for the UI).
      - user: ingest
        pass:
        ips: []
        permissions:
          - action: read
            path: stream
          - action: api
      # 2: mediamtx's default local admin (inside the pod only).
      - user: any
        pass:
        ips: ["127.0.0.1", "::1"]
        permissions:
          - action: api
          - action: metrics
    paths:
      all_others:
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  labels:
    app: edge-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.21.0
          env:
            - name: MTX_AUTHINTERNALUSERS_0_PASS
              valueFrom:
                secretKeyRef: {name: edge-auth, key: ue-stream-key}
            - name: MTX_AUTHINTERNALUSERS_1_PASS
              valueFrom:
                secretKeyRef: {name: edge-auth, key: gateway-ingest-key}
          ports:
            - containerPort: 8554
              name: rtsp
            - containerPort: 9997
              name: api
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: edge-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
spec:
  selector:
    app: edge-gateway
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
      nodePort: 30554
      protocol: TCP
  type: NodePort
  # Local = no kube-proxy SNAT, so mediamtx sees the UE's real 10.47.x.x
  # source address (the whole point of the un-NAT'd edge DNN).
  externalTrafficPolicy: Local
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway-api
spec:
  selector:
    app: edge-gateway
  ports:
    - name: api
      port: 9997
      targetPort: 9997

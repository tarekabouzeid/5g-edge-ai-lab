# Phase 5: video ingestion + lightweight object detection (CPU; the single
# GPU is reserved for the VLM in vlm-deployment.yaml).
# The image is built inside minikube's Docker daemon by edge/minikube-up.sh,
# hence imagePullPolicy: Never below (no registry involved).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-ingest
  labels:
    app: edge-ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-ingest
  template:
    metadata:
      labels:
        app: edge-ingest
    spec:
      containers:
        - name: ingest
          image: edge-ingest:local
          imagePullPolicy: Never
          env:
            - name: RTSP_BASE
              value: "rtsp://edge-gateway:8554"
            # The gateway only speaks RTSP over TCP (it sits behind Envoy).
            - name: OPENCV_FFMPEG_CAPTURE_OPTIONS
              value: "rtsp_transport;tcp"
            - name: VLM_URL
              value: "http://vlm:8000/v1/chat/completions"
            - name: VLM_MODEL
              value: "google/gemma-4-E4B-it"
            # Security (docs/security.md); the pod won't start without these.
            # This pod is the OAuth 2.0 client "edge-ingest" of edge-authz:
            # its token reads ue/* streams and queries the gateway API.
            # Callers of its own API must present edge-authz tokens.
            - name: AUTHZ_URL
              value: "http://edge-authz:8080"
            - name: CLIENT_ID
              value: "edge-ingest"
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: edge-auth, key: ingest-client-secret}
            - name: VLM_API_KEY
              valueFrom:
                secretKeyRef: {name: edge-auth, key: vlm-api-key}
            # A new scene description every ~4s (a new call is skipped while one
            # is still in flight; the VLM answers in ~0.3s).
            - name: VLM_INTERVAL_SECONDS
              value: "4"
            # One GPU in this lab, reserved for the VLM — YOLOv8n runs on CPU
            # (ultralytics falls back automatically). "void" stops the NVIDIA
            # runtime from exposing the GPU even though the base image sets
            # NVIDIA_VISIBLE_DEVICES=all.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "void"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: edge-ingest
spec:
  selector:
    app: edge-ingest
  # Cluster-internal: the portal and phones reach it through Envoy
  # (edge/manifests/edge-envoy.yaml — HTTPS :30443, /healthz on :30080).
  ports:
    - name: http
      port: 8080
      targetPort: 8080

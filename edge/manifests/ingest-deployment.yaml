# Phase 5: video ingestion + lightweight object detection (CPU; the single
# GPU is reserved for the VLM in vlm-deployment.yaml).
# The image is built inside minikube's Docker daemon by edge/minikube-up.sh,
# hence imagePullPolicy: Never below (no registry involved).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-ingest
  labels:
    app: edge-ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-ingest
  template:
    metadata:
      labels:
        app: edge-ingest
    spec:
      containers:
        - name: ingest
          image: edge-ingest:local
          imagePullPolicy: Never
          env:
            - name: RTSP_URL
              value: "rtsp://edge-gateway:8554/stream"
            - name: VLM_URL
              value: "http://vlm:8000/v1/chat/completions"
            - name: VLM_MODEL
              value: "google/gemma-4-E4B-it"
            # Keys from the edge-auth Secret (docs/security.md); the pod won't
            # start without them. GATEWAY_*: this pod's own read-only login
            # to edge-gateway. INGEST_API_KEY: what callers of this pod's API
            # (the portal, Prometheus) must present. VLM_API_KEY: for the vlm.
            - name: GATEWAY_USER
              value: "ingest"
            - name: GATEWAY_PASS
              valueFrom:
                secretKeyRef: {name: edge-auth, key: gateway-ingest-key}
            - name: INGEST_API_KEY
              valueFrom:
                secretKeyRef: {name: edge-auth, key: ingest-api-key}
            - name: VLM_API_KEY
              valueFrom:
                secretKeyRef: {name: edge-auth, key: vlm-api-key}
            # A new scene description every ~4s (a new call is skipped while one
            # is still in flight; the VLM answers in ~0.3s).
            - name: VLM_INTERVAL_SECONDS
              value: "4"
            # One GPU in this lab, reserved for the VLM — YOLOv8n runs on CPU
            # (ultralytics falls back automatically). "void" stops the NVIDIA
            # runtime from exposing the GPU even though the base image sets
            # NVIDIA_VISIBLE_DEVICES=all.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "void"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: edge-ingest
spec:
  selector:
    app: edge-ingest
  # NodePort so the host-side lab portal (portal/) and the UE's RTT probe can
  # reach it without a kubectl port-forward. Everything but /healthz needs
  # the ingest API key (the UE can reach this port too).
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

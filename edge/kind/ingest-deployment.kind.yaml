# KIND variant of edge/manifests/ingest-deployment.yaml: no nvidia.com/gpu
# resource request (plain KIND has no GPU device plugin — the pod would
# stay Pending forever if it asked for one), and a NodePort Service instead
# of ClusterIP so `curl localhost:30080/status` works straight from the
# host. YOLOv8n and torch both fall back to CPU automatically when no CUDA
# device is visible, so this still exercises the real ingestion code path —
# just slower, and it's the reason this is a *separate* manifest rather than
# the one used on the real GPU host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-ingest
  labels:
    app: edge-ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-ingest
  template:
    metadata:
      labels:
        app: edge-ingest
    spec:
      containers:
        - name: ingest
          image: edge-ingest:local
          imagePullPolicy: Never
          env:
            - name: RTSP_URL
              value: "rtsp://edge-gateway:8554/stream"
            - name: VLM_URL
              value: "http://vlm:8000/v1/chat/completions"
            - name: VLM_MODEL
              value: "Qwen/Qwen2-VL-2B-Instruct"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: edge-ingest
spec:
  selector:
    app: edge-ingest
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

# Phase 8: a minimal, dependency-free Prometheus (no Operator/Helm needed)
# for a single-node lab. Static scrape targets only, so no RBAC needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: edge-ingest
        static_configs:
          - targets: ["edge-ingest:8080"]
      - job_name: vlm
        static_configs:
          - targets: ["vlm:8000"]
      # scripts/host-gpu-exporter.py on the host (nvidia-smi -> DCGM_FI_DEV_*
      # metric names; NVIDIA's DCGM doesn't run under WSL2).
      # 192.168.49.1 = the host on the minikube bridge.
      - job_name: host-gpu
        static_configs:
          - targets: ["192.168.49.1:9400"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.3
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090

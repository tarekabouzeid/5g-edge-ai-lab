# CI for the 5G Edge AI Lab.
#
# Scope, deliberately: this repo's actual DoD (a real UE registering over a
# simulated radio link, a real GPU running inference) needs hardware this
# repo cannot assume CI has — see docs/phase-notes/phase-0.md. What CI *can*
# verify on every push, without a GPU or SCTP-capable RAN stack:
#   - every config/manifest/script is syntactically valid and internally
#     consistent (lint job)
#   - the Open5GS core's containers actually start and reach a healthy
#     state, and a subscriber can really be provisioned into MongoDB
#     (core-smoke-test job) — this is Phase 1's DoD, minus the RAN
#
# NOT covered here, and not claimed to be:
#   - UERANSIM registration/PDU session establishment (needs SCTP + a
#     simulated radio link, unreliable to assert on shared CI runners)
#   - the UPF's actual TUN/GTP-U data path (GitHub-hosted runners refuse TUN
#     device creation even inside a privileged container — "ioctl() failed
#     ... Operation not permitted" — a runner-infrastructure limitation, not
#     a config bug; see docs/phase-notes/phase-1.md)
#   - building edge/ingest's image and running it (Phases 4/5/6/8): that
#     image's base (a multi-GB CUDA/PyTorch runtime) plus deps routinely
#     exceeded standard GitHub-hosted runners' disk, and it needs a real GPU
#     to be a meaningful test anyway. This is validated on the actual GPU
#     host per docs/phase-notes/phase-5.md instead — kubeconform still
#     validates the K8s manifests themselves in the lint job below, just
#     not a live deploy.
#   - real GPU inference (needs a GPU CI runners don't have)
# Those stay real-host-only checks (the image build is also available as a
# manual workflow_dispatch job below, not run on every push).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday — drives the check-latest-versions job below

jobs:
  lint:
    name: Lint & validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          pip install --quiet pyyaml
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Validate all YAML parses
        run: |
          python3 - <<'EOF'
          import yaml, glob, sys
          files = glob.glob("**/*.yml", recursive=True) + glob.glob("**/*.yaml", recursive=True)
          errors = []
          for f in sorted(files):
              try:
                  with open(f) as fh:
                      list(yaml.safe_load_all(fh))
              except Exception as e:
                  errors.append((f, str(e)))
          for f, e in errors:
              print(f"FAIL {f}: {e}")
          sys.exit(1 if errors else 0)
          EOF

      - name: Validate Grafana dashboard JSON
        run: python3 -c "import json; json.load(open('monitoring/grafana-dashboards/gpu-and-pipeline.json'))"

      - name: ShellCheck all scripts
        run: shellcheck -S warning $(find . -name '*.sh' -not -path './.git/*')

      - name: Python syntax check
        run: python3 -m py_compile edge/ingest/app.py portal/app.py portal/rules.py scripts/host-gpu-exporter.py

      - name: Lint edge/ingest/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: edge/ingest/Dockerfile
          failure-threshold: error

      - name: Lint portal/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: portal/Dockerfile
          failure-threshold: error

      - name: Validate docker-compose files
        run: |
          cp .env.example .env
          docker compose -f core/docker-compose.yml --env-file .env config -q
          docker compose -f ran/docker-compose.yml --env-file .env config -q
          docker compose -f portal/docker-compose.yml --env-file .env config -q

      - name: Validate Kubernetes manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary \
            edge/manifests/*.yaml \
            monitoring/manifests/*.yaml

  core-smoke-test:
    name: Open5GS core smoke test (Phase 1 DoD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load SCTP kernel module
        run: sudo modprobe sctp && lsmod | grep sctp

      - name: Bring up the core
        run: |
          cp .env.example .env
          cd core
          docker compose --env-file ../.env up -d
          cd ..

      - name: Wait for all NFs to be running and stable
        run: |
          cd core
          # open5gs-upf is excluded from this check: GitHub-hosted runners
          # refuse TUN device creation even inside a privileged container
          # ("ioctl() failed ... Operation not permitted"), so UPF cannot
          # fully initialize here regardless of compose config — a runner
          # limitation, not something this repo's config controls. See
          # docs/phase-notes/phase-1.md and the workflow header comment.
          # Every other NF (including subscriber provisioning, which needs
          # AMF/AUSF/UDM/UDR/etc., not UPF) is still held to the full check.
          NON_UPF_SERVICES=$(docker compose config --services | grep -v '^upf$')
          other_services() { docker compose ps -q $NON_UPF_SERVICES; }

          for i in $(seq 1 30); do
            total=$(other_services | wc -l)
            running=$(docker compose ps --status running -q $NON_UPF_SERVICES | wc -l)
            echo "running: $running / $total (excluding upf)"
            [ "$running" = "$total" ] && [ "$total" -gt 0 ] && break
            sleep 5
          done
          docker compose ps
          echo "Restart counts, excluding upf (any nonzero means a container crashed):"
          bad=0
          for c in $(other_services); do
            name=$(docker inspect --format '{{.Name}}' "$c")
            count=$(docker inspect --format '{{.RestartCount}}' "$c")
            echo "$name: $count"
            [ "$count" = "0" ] || bad=1
          done
          [ "$bad" = "0" ] || { echo "::error::at least one non-UPF NF container restarted — see logs below"; exit 1; }

      - name: Provision the test subscriber
        run: ./scripts/provision-subscriber.sh

      - name: Dump logs on failure
        if: failure()
        run: cd core && docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: cd core && docker compose down -v

  # --- Manual-only: GPU/CUDA image build ---
  # Not run on every push. The edge/ingest image bundles a multi-GB CUDA/
  # PyTorch runtime and needs a real GPU to be a meaningful test anyway —
  # validate it on the actual GPU host (docs/phase-notes/phase-5.md) rather
  # than fighting standard GitHub-hosted runners' disk space. Kept as an
  # opt-in "does the Dockerfile still build" check (Actions tab -> Run
  # workflow).
  build-ingest-image:
    name: "[manual] Build edge/ingest image"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build (cached, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: edge/ingest
          push: false
          tags: edge-ingest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

  check-latest-versions:
    name: Check for newer upstream versions (informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-latest-versions.sh
